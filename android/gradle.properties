org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# 项目级禁用 daemon（T0-TOOLCHAIN R3 第七轮 finding #1）：scripts/verify.ps1 的 Android 闸调用不带 --no-daemon
# （该改动已随三次破例撤销归还 T0-GATE-HARDENING，本卡不得再碰 scripts/）——改在这里项目级堵，效果等价且更强：
# 无论调用方（verify.ps1 / CI 在线预热 build / 本机手跑）加不加 --no-daemon，都不会复用/常驻 daemon 进程，
# 消除「预热步骤残留 daemon 状态被后续 --offline 闸复用」的非确定性缺口。
org.gradle.daemon=false
android.useAndroidX=true
kotlin.code.style=official
