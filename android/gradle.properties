org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# AGP 9.0+ 默认内置 Kotlin 支持（自带 KGP 2.2.10），与本卡显式 pin 的 Kotlin 2.4.10（libs.versions.toml）不一致，
# 会令 :core（kotlin("jvm") 2.4.10）与 :app 落在两个不同 Kotlin 版本。显式退出内置 Kotlin，改用标准
# org.jetbrains.kotlin.android 插件统一全项目 Kotlin 版本（该退出口子官方保证支持到 AGP 10.0 之前，见
# https://developer.android.com/build/migrate-to-built-in-kotlin#opt-out-of-built-in-kotlin）。
android.builtInKotlin=false
# AGP 9.0+ 同时默认开启「新 DSL」（android.newDsl=true），与经典 org.jetbrains.kotlin.android 插件不兼容
# （报 ApplicationExtensionImpl 无法转型 BaseExtension）。第三方生态（含本卡要 pin 的 SQLDelight 等）
# 2026-08 时点尚未普遍验证过新 DSL，一并退出以落地在业界公认稳定的经典模型上。
android.newDsl=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
